// Stella counts how often the name is called in A Streetcar Named Desire. The lab that
// uses this project compiles it three ways - a fat jar, a jlink runtime, and a GraalVM
// native image - to compare what each one costs to ship.
//
// The build had stopped working entirely. Gradle 7.4.1 cannot run on Java 21, which the
// lab image now provides, and it fails while parsing the build script rather than
// anywhere useful. Behind that sat a second, permanent problem: the project applied
// org.springframework.experimental.aot, the Spring Native beta plugin, which was retired
// when Spring Boot 3 absorbed ahead-of-time processing into the framework itself. That
// plugin is no longer published, so the build could never resolve it again.
//
// AOT is now built in. The GraalVM buildtools plugin below is what wires `nativeCompile`
// into Gradle, and Spring Boot's own plugin runs the AOT processing that native images
// need before it.
plugins {
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'

	id 'org.graalvm.buildtools.native' version '1.1.9'
}

group = 'com.dijure.stella'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

// BP_NATIVE_IMAGE tells the Paketo buildpack to run GraalVM's native-image compiler
// instead of packaging a JVM. The builder is deliberately not named here: Spring Boot
// picks a current one, and pinning it is how this build ended up asking for
// paketobuildpacks/builder:tiny, a tag that has since been retired.
tasks.named('bootBuildImage') {
	environment = [
		'BP_NATIVE_IMAGE': 'true',
		// BP_JVM_VERSION is not optional here, and the failure it prevents is worth
		// recording because the message only appears deep inside the buildpack output:
		//
		//   Java Major version from the JRE: 17
		//   the Java version from the downloaded NIK/GraalVM is lower than 25 and the
		//   Spring Boot version is >= 4.0.0; this is not supported
		//   https://github.com/paketo-buildpacks/spring-boot/issues/562
		//
		// The jar targets Java 17 above, because the lab host that runs this build has an
		// older JDK, so the buildpack sizes its GraalVM to match and picks NIK 17. Spring
		// Boot 4 requires 25 or newer. Compiling 17-targeted classes with a 25 native-image
		// is fine; the two versions are answering different questions.
		'BP_JVM_VERSION': '25',
	]
}
